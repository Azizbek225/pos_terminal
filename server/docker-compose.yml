# Ishga tushirish:   cp .env.example .env  &&  docker compose up -d
# Tekshirish:        http://<kompyuter-IP>:8000/api/health
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylida POSTGRES_PASSWORD yozing}
      TZ: Asia/Tashkent
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POS_DATABASE_URL: postgresql+psycopg://pos:${POSTGRES_PASSWORD}@db:5432/pos
      POS_API_KEY: ${POS_API_KEY:?.env faylida POS_API_KEY yozing}
    ports:
      - "8000:8000"

volumes:
  pos_pgdata:
